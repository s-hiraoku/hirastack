[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hirastack"
version = "0.1.0"
description = "Dependency-free runner for source-cited design verification contracts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hirastack = "hirastack.cli:main"

[tool.setuptools]
packages = ["hirastack"]
