name: Verify design harness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-project:
    name: Python contract (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: hirastack
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Audit and execute the independent Python project contract
        working-directory: hirastack
        run: |
          python3 -m hirastack audit --target "$PWD" --spec projects/hirastack/contract.json
          python3 -m hirastack run --target "$PWD" --spec projects/hirastack/contract.json --out "$RUNNER_TEMP/self-proof" --execute
      - name: Retain contract report and assertion output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: self-${{ matrix.os }}-${{ matrix.python }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/self-proof/report.json
            ${{ runner.temp }}/self-proof/report.md
            ${{ runner.temp }}/self-proof/python-regressions.log
