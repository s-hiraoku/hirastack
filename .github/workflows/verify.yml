name: Verify design harness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-project:
    name: Python contract (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: hirastack
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Audit and execute the independent Python project contract
        working-directory: hirastack
        run: |
          python3 -m hirastack audit --target "$PWD" --spec projects/hirastack/contract.json
          python3 -m hirastack run --target "$PWD" --spec projects/hirastack/contract.json --out "$RUNNER_TEMP/self-proof" --execute
      - name: Retain contract report and assertion output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: self-${{ matrix.os }}-${{ matrix.python }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/self-proof/report.json
            ${{ runner.temp }}/self-proof/report.md
            ${{ runner.temp }}/self-proof/python-regressions.log
