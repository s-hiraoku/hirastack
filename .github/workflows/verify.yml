name: Verify design harness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-project:
    name: Python contract (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: hirastack
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Audit and execute the independent Python project contract
        working-directory: hirastack
        run: |
          python3 -m hirastack audit --target "$PWD" --spec projects/hirastack/contract.json
          python3 -m hirastack run --target "$PWD" --spec projects/hirastack/contract.json --out "$RUNNER_TEMP/self-proof" --execute
      - name: Retain contract report and assertion output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: self-${{ matrix.os }}-${{ matrix.python }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/self-proof/report.json
            ${{ runner.temp }}/self-proof/report.md
            ${{ runner.temp }}/self-proof/python-regressions.log

  hab-project:
    name: HAB pinned communication contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: hirastack
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: s-hiraoku/hiraoku-agent-base
          ref: c667095dcd3b0d7c672b522fe3dd45eaeade0c81
          persist-credentials: false
          path: hab-reference
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: hab-reference/package-lock.json
      - name: Prepare the pinned isolated HAB checkout
        working-directory: hab-reference
        run: npm ci --no-audit --no-fund
      - name: Verify every automatic check and preserve incomplete scope
        working-directory: hirastack
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          out = Path(os.environ["RUNNER_TEMP"]) / "hab-proof"
          result = subprocess.run([
              sys.executable, "-m", "hirastack", "run",
              "--target", "../hab-reference",
              "--spec", "projects/hab/contract.json",
              "--out", str(out), "--execute",
          ])
          if result.returncode != 2:
              raise SystemExit(f"expected explicitly incomplete contract, got {result.returncode}")
          report = json.loads((out / "report.json").read_text())
          automatic = [c for c in report["checks"] if "argv" in c]
          manual = [c for c in report["checks"] if "argv" not in c]
          assert len(automatic) == 14 and all(c["status"] == "pass" for c in automatic), automatic
          assert sum(c.get("passed_tests", 0) for c in automatic) == 403
          assert len(manual) == 5 and all(c["status"] == "unverified" for c in manual), manual
          assert report["overall"] == "incomplete" and not report["drift"]
          assert report["before"] == report["after"]
          assert report["verification_inputs_before"] == report["verification_inputs_after"]
          assert all(c["cleanup"] == "confirmed" for c in automatic)
          print("14 automatic checks / 403 tests passed; 5 manual checks remain unverified.")
          PY
      - name: Retain synthetic proof without private stores
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hab-pinned-contract
          retention-days: 7
          path: |
            ${{ runner.temp }}/hab-proof/report.json
            ${{ runner.temp }}/hab-proof/report.md
            ${{ runner.temp }}/hab-proof/*.log
            ${{ runner.temp }}/hab-proof/mcp-live/proof.json
            ${{ runner.temp }}/hab-proof/mcp-live/cleanup.json
